 boxed:{g:'library',n:'L1 · Boxed set',d:'The open side of a slipcase: the volumes\' spines in a row, gilt bands and numbers. Reads "several books by one hand" before the title.',
  h:([t,m,c])=>`<div class="case cloth sheen"></div><div class="slot">${['I','II','III','IV','V'].map((n,i)=>`<div class="sp" style="--s:${mix(c,[100,82,92,74,88][i],i%2?'#000':'#fff')}"><i>${n}</i></div>`).join('')}</div><div class="txt center"><div class="t">${t}</div><div class="kick">${m.toUpperCase()}</div></div>`},
 slip:{g:'library',n:'L2 · Slipcase',d:'The closed side of the case, blind-stamped, with two volumes riding up out of the mouth. The set as a gift.',
  h:([t,m,c])=>`<div class="vol" style="left:13%;--y:4%;--s:${mix(c,78,'#000')}"></div><div class="vol" style="left:50%;--y:9%;--s:${mix(c,85,'#fff')}"></div><div class="case cloth sheen"><div class="frame"></div></div><div class="lab center" style="top:30%"><div class="t">${t}</div><div class="r"></div><div class="kick">${m.toUpperCase()}</div></div>`},
 exlib:{g:'library',n:'L3 · Ex libris',d:'A bookplate pasted on the cloth: "from the library of…". For an author\'s shelf it names the author; the plate\'s double rule takes the tone.',
  h:([t,m,c])=>`<div class="cloth" style="position:absolute;inset:0"></div><div class="weave"></div><div class="plate center"><div class="kick">EX BIBLIOTHECA</div><div class="t">${t}</div><div class="n">${m.toUpperCase()}</div></div>`},
 packet:{g:'devotion',n:'D1 · Packet',d:'Holy cards fanned in the hand: two on colored stock behind, the cream one on top. The same cards as the prayers inside, so the collection says what it holds.',
  h:([t,m,c])=>`<div class="card b1">${lace()}</div><div class="card b2">${lace()}</div><div class="card top">${lace()}<div class="in center"><div class="t">${t}</div><div class="kick">${m.toUpperCase()}</div></div></div>`},
 bundle:{g:'devotion',n:'D2 · Bundle',d:'A stack of cards tied with a silk ribbon in the tone, the way a grandmother keeps them. The stack\'s edges count the prayers.',
  h:([t,m,c])=>`${[4,3,2,1].map(i=>`<div class="c" style="transform:translate(${i*1.4}em,${i*1.6}em);background:${i%2?'var(--from)':'#E4D5B6'}"></div>`).join('')}<div class="c top"></div><div class="rv"></div><div class="rh"></div><div class="loop" style="left:17%;transform:rotate(-18deg)"></div><div class="loop" style="left:33%;transform:rotate(18deg)"></div><div class="tail" style="left:27%;transform:rotate(14deg)"></div><div class="tail" style="left:33%;transform:rotate(-10deg)"></div><div class="knot"></div><div class="txt center"><div class="t">${t}</div><div class="kick">${m.toUpperCase()}</div></div>`},
 tucked:{g:'devotion',n:'D3 · Tucked missal',d:'A missal fat with holy cards, their lace tops showing above the pages. A book of prayers rather than a book to read.',
  h:([t,m,c])=>`${[['16%','4%','-8deg','var(--paper)'],['40%','1%','3deg',T[c][0]],['60%','5%','10deg','#E4D5B6']].map(([x,y,r,col])=>`<div class="peek" style="--x:${x};--y:${y};--r:${r};--c:${col}">${lace()}</div>`).join('')}<div class="book cloth hinge"><div class="f center"><div class="x">${cross}</div><div class="t">${t}</div><div class="kick">${m.toUpperCase()}</div></div></div>`},
 ordo:{g:'rule',n:'R1 · Ordo',d:'A page of the calendar: the tone as a heading band, the day\'s entries in rubric. The Ordo you kept for later, here for plans and weekdays.',
  h:([t,m,c])=>`<div class="head cloth"><div class="kick">ORDO</div><div class="kick">${m.toUpperCase()}</div></div><div class="t">${t}</div><div class="rows">${['MANE','MERIDIE','VESPERE'].map((h,i)=>`<div><b>${h}</b><i style="max-width:${[100,80,90][i]}%"></i></div>`).join('')}</div>`},
 ribbons:{g:'rule',n:'R2 · Ribbons',d:'A thick breviary whose marker ribbons hang in the liturgical colors, one per part of the day. A book you return to, not one you finish.',
  h:([t,m,c])=>`<div class="bk cloth hinge"><div class="f center"><div class="x">${cross}</div><div class="t">${t}</div><div class="kick">${m.toUpperCase()}</div></div></div>${[['26%','#2F6B3F','22%'],['36%','#8E1B24','18%'],['46%','#5B2E7A','24%'],['56%','#C9A24A','16%'],['66%','#EDE3CF','20%']].map(([l,col,h])=>`<div class="rb" style="left:${l};--c:${col};--h:${h}"></div>`).join('')}`},
 horo:{g:'rule',n:'R3 · Horologium',d:'The week as a dial of day letters; the day the collection keeps is lit in gold. Plans light the whole ring.',
  h:([t,m,c,day])=>{const days='SMTWTFS'.split(''),lit=day==='·'?[0,1,2,3,4,5,6]:[day==='F'?5:6]
   const pts=days.map((d,i)=>{const a=(i/7)*Math.PI*2-Math.PI/2,x=50+37*Math.cos(a),y=50+37*Math.sin(a);const on=lit.includes(i)&&day!=='·';return `<circle cx="${x}" cy="${y}" r="9" fill="${on?'#E8C97A':'none'}" stroke="rgba(232,201,122,${on?1:.35})" stroke-width="1"/><text x="${x}" y="${y+3.6}" text-anchor="middle" font-family="Cinzel" font-size="10" fill="${on?T[c][1]:'#E8C97A'}">${d}</text>`}).join('')
   return `<div class="cloth sheen" style="position:absolute;inset:0;border-radius:inherit"></div><svg class="dial" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="none" stroke="rgba(232,201,122,.55)" stroke-width="1"/><circle cx="50" cy="50" r="26" fill="none" stroke="rgba(232,201,122,.3)" stroke-width="1" stroke-dasharray="1 3"/>${pts}<g transform="translate(42 42) scale(.68)" fill="#E8C97A"><path d="M9.5 2h5v7.5H22v5h-7.5V22h-5v-7.5H2v-5h7.5z"/></g></svg><div class="txt center"><div class="t">${t}</div><div class="kick">${m.toUpperCase()}</div></div>`}},
 tract:{g:'articles',n:'A1 · Tract',d:'A single printed sheet with the corner turned: collection as a red kicker, title, the subtitle in italic, reading time at the foot.',
  h:([t,s,k,n])=>`<div class="ear"></div><div class="kick">${k.toUpperCase()}</div><div class="rule"></div><div class="t">${t}</div><div class="sub">${s}</div><div class="min">${n} MIN READ</div><div class="fl">❧</div>`},
 journal:{g:'articles',n:'A2 · Periodical',d:'A page from a journal: masthead, centered title, two columns of text with a red Fraktur initial. The formation essays as a quarterly.',
  h:([t,s,k,n])=>`<div class="mast">${k.toUpperCase()}</div><div class="t">${t}</div><div class="sub">${s}</div><div class="cols"><div class="col"><span class="dc">${t[0]}</span><i class="in"></i><i class="in"></i>${[1,1,.7].map(w=>`<i style="width:${w*100}%"></i>`).join('')}</div><div class="col">${[1,1,.9,1,.5].map(w=>`<i style="width:${w*100}%"></i>`).join('')}</div></div>`},
 pamph:{g:'articles',n:'A3 · Pamphlet',d:'A stapled paper wrapper in the tone (no board, no hinge: thinner than a book) with a printed cream panel, like the old Catholic Truth Society penny tracts.',
  h:([t,s,k,n,c])=>`<div class="cloth" style="position:absolute;inset:0;background:linear-gradient(155deg,${mix(c,82,'#E6D8BC')},${mix(c,90,'#000')})"></div><div class="grain"></div><div class="st" style="top:22%"></div><div class="st" style="bottom:22%"></div><div class="kick">${k.toUpperCase()}</div><div class="panel center"><div class="t">${t}</div><div class="r"></div><div class="sub">${s}</div></div><div class="min">${n} MIN</div>`},
 titlepg:{g:'articles',n:'A4 · Title page',d:'All type: a ruled frame, the title set in capitals, a line of ornament, reading time as the imprint. The most "library" of the four.',
  h:([t,s,k,n])=>`<div class="fr"></div><div class="body center"><div class="kick">${k.toUpperCase()}</div><div class="t">${t}</div><div class="sub">${s}</div><div class="orn">❦</div><div class="min">${n} MIN READ</div></div>`},
}
const shadowed=['packet','bundle','tucked','ribbons','slip','boxed','exlib','tract','journal','titlepg']
const tile=(k,x,w)=>{const c=F[k].g==='articles'?x[4]:x[2]
 return `<div class="tile ${k} ${shadowed.includes(k)?'shadow':''}" style="--w:${w}px;${tone(c)}">${F[k].h(x)}</div>`}
const groups={library:['LIBRARY — AN AUTHOR, A SERIES',library],devotion:['DEVOTION — A GATHERING OF PRAYERS',devotion],rule:['RULE — A PLAN, A DAY, A SEASON',rule],articles:['ARTICLES — A CHAPTER READ ON ITS OWN (10:13)',articles]}
const q=new URLSearchParams(location.search), secs=(q.get('s')||'library,devotion,rule,articles').split(',')
let html=''
for(const s of secs){
 if(groups[s]){const [h,list]=groups[s];html+=`<h2>${h}</h2>`
  for(const [k,f] of Object.entries(F).filter(([,f])=>f.g===s))
   html+=`<div class="fmt ${s==='articles'?'art':''}"><div class="lbl"><h3>${f.n}</h3><p>${f.d}</p></div><div class="row">${list.slice(0,4).map(x=>tile(k,x,s==='articles'?134:150)).join('')}${tile(k,list[4],s==='articles'?80:90)}</div></div>`}
 if(s==='context'){
  const cell=(el,t,sub,w)=>`<div>${el}<div class="cap" style="--cw:${w}px">${t}</div><div class="sub2" style="--cw:${w}px">${sub}</div></div>`
  const painted=(img,w=150)=>`<div class="painted" style="--w:${w}px;background-image:url(../../../content/art/${img})"></div>`
  const L=q.get('l')||'boxed',D=q.get('d')||'packet',R=q.get('r')||'ordo',A=q.get('a')||'pamph'
  html+=`<h2>IN CONTEXT</h2><div class="fmt"><div class="lbl"><h3>Explore · Traditions</h3><p>Painted collections keep their art; the art-less ones take their object. Title below as today.</p></div><div class="stage">
   ${cell(painted('carmelite.jpg'),'Carmelite Tradition','',150)}${cell(tile(L,library[0],150),'St. Augustine of Hippo','',150)}${cell(painted('marian.jpg'),'Marian Devotion','',150)}${cell(tile(D,devotion[0],150),'Confession & Conversion','',150)}${cell(tile(R,rule[0],150),'The Norms of Piety','',150)}</div></div>
  <div class="fmt"><div class="lbl"><h3>Inside a collection</h3><p>A section of Mental Prayer: the article stands between the square cards and the tall books, on the same baseline.</p></div><div class="stage">
   ${cell(`<div class="tile stock shadow" style="--w:140px;${tone('violet')};--lace:var(--from)">${lace()}<div class="in center"><div class="t">Examen</div><div class="kick">10 MIN</div></div></div>`,'Examen','Practice',140)}
   ${cell(tile(A,articles[0],140),'When Prayer Goes Dark','Article',140)}
   ${cell(`<div class="tile holy shadow" style="--w:140px;${tone('marian')};--lace:var(--paper)">${lace()}<div class="in center"><div class="t">Anima Christi</div></div></div>`,'Anima Christi','Prayer',140)}
   ${cell(tile(A,articles[3],140),'Lectio Divina','Article',140)}
   ${cell(`<div class="tile vbook cloth hinge" style="--w:112px;${tone('burgundy')}"><div class="f center"><div style="width:10em;height:10em;color:var(--gold)">${cross}</div><div><div class="t">Introduction to the Devout Life</div><div class="a">St. Francis de Sales</div></div><div class="kick">EMBER LIBRARY</div></div></div>`,'Introduction to the Devout Life','Book',112)}</div></div>
  <div class="fmt" style="border:0"><div class="lbl"><h3>Collection page</h3><p>The header shows the object centered on its tone, as the book page now does.</p></div><div class="stage" style="gap:24px">
   ${[[L,library[0]],[D,devotion[0]],[R,rule[0]]].map(([k,x])=>`<div class="hero" style="background:linear-gradient(180deg,${T[x[2]][0]},${T[x[2]][1]})"><div style="position:absolute;left:50%;top:60px;transform:translateX(-50%)">${tile(k,x,190)}</div><div class="under"><h4>${x[0]}</h4><p>${x[1]}</p></div></div>`).join('')}</div></div>`}
}
document.getElementById('app').innerHTML=html
</script></body></html>
