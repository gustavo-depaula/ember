<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel&family=EB+Garamond:ital,wght@0,600;1,400&display=swap">
<style>
body{margin:0;background:#0d0c0b;color:#F5EFE2;padding:22px 24px 26px;width:592px;font-family:Cinzel;zoom:2}
.row{display:flex;gap:28px}
.col{width:160px}
.tag{font-size:8px;letter-spacing:1.6px;color:#E8C97A;margin-bottom:10px;height:20px}
.card{position:relative;width:160px;height:160px;border-radius:6.4px;overflow:hidden;
 background:linear-gradient(#F6EEDC,#E9DBBD);box-shadow:0 5px 9px rgba(0,0,0,.3)}
.band{position:absolute;left:0;right:0;top:0;height:32px;display:flex;align-items:center;justify-content:space-between;
 padding:0 14.4px;box-sizing:border-box;font-size:8.5px;letter-spacing:1.6px}
.rule{position:absolute;left:0;right:0;top:34.9px;height:1.4px;opacity:.7}
.title{position:absolute;left:14.4px;top:41.6px;font:600 19px/20px "EB Garamond";color:#2A1F16;white-space:nowrap}
.body{position:absolute;left:14.4px;right:14.4px;bottom:13px}
.e{font-size:7.5px;letter-spacing:1.2px;color:#2A1F16;margin-top:4.5px;white-space:nowrap}
.it{font:italic 12px/14.5px "EB Garamond";color:#5B4A38}
.cta{font-size:7.5px;letter-spacing:1.2px;color:#9B2226;margin-top:8px}
.cap{font-size:13px;margin-top:10px;letter-spacing:.3px;font-variant:small-caps}
.ink{background:linear-gradient(115deg,#2E3A4A,#11161E)} .gold{background:linear-gradient(115deg,#8B6914,#352608)}
.red{background:linear-gradient(115deg,#6B1620,#2A080C)}
.line{height:1px;background:#2A1F16;opacity:.18;margin-top:9px}
</style>
<div class="row">
 <div class="col"><div class="tag">SEM PLANO</div>
  <div class="card"><div class="band red"><span>A COMEÇAR</span></div><div class="rule" style="background:#6B1620"></div>
   <div class="title">Plano de Vida</div>
   <div class="body"><div class="it">Poucas práticas, rezadas todos os dias.</div><div class="cta" style="margin-top:4.5px">MONTAR MEU PLANO →</div></div></div>
  <div class="cap">Monte seu plano</div></div>

 <div class="col"><div class="tag">PLANO SEM NADA HOJE</div>
  <div class="card"><div class="band red"><span>DIA VAZIO</span></div><div class="rule" style="background:#6B1620"></div>
   <div class="title">Plano de Vida</div>
   <div class="body"><div class="it">Nenhuma prática do plano cai hoje.</div><div class="cta" style="margin-top:4.5px">ADICIONAR PRÁTICAS →</div></div></div>
  <div class="cap">O plano de hoje</div></div>
</div>
