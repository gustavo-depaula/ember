<title>Ember First Steps</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Drawn in the app's own language: white page, ink type, gold for what is precious and tappable,
   paintings in rounded tiles or a full-bleed head, the plan as beads on a thread. */
:root {
  color-scheme: light;
  --bg: #fff; --surface: #F5F5F5; --ink: #2C2418; --muted: #6B5D4F; --gold: #C9A84C; --goldDeep: #A8872E; --line: #E5DDD2;
  --burgundy: #6B1D2A; --red: #9E2A2B; --cream: #F5EFE2; --creamSoft: rgba(245,239,226,.8); --label: #E8C97A; --green: #1E4A32; --night: #14100C;
  --stage: #E4DCCB; --stageInk: #4A3C22; --stageMuted: #5D5039;
  --head: Cinzel, Georgia, serif; --title: Junicode, Garamond, Georgia, serif; --body: Garamond, Georgia, serif;
}
@font-face { font-family: Garamond; src: url(a/EBGaramond_400Regular.woff2); font-display: swap; }
@font-face { font-family: Garamond; font-weight: 600; src: url(a/EBGaramond_600.ttf); font-display: swap; }
@font-face { font-family: Garamond; font-style: italic; src: url(a/EBGaramond_400Regular_Italic.woff2); font-display: swap; }
@font-face { font-family: Cinzel; src: url(a/Cinzel_400Regular.woff2); font-display: swap; }
@font-face { font-family: Junicode; src: url(a/Junicode.woff2); font-display: swap; }
@font-face { font-family: Junicode; font-style: italic; src: url(a/Junicode-Italic.woff2); font-display: swap; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--stage); color: var(--ink); font: 18px/25px var(--body); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: left; }
button:focus-visible { outline: 2px solid var(--goldDeep); outline-offset: 2px; }
.wrap { max-width: 1040px; margin: 0 auto; padding-block: 22px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top h1 { font: italic 400 31px/37px var(--title); }
.top p { color: var(--stageMuted); margin-top: 3px; max-width: 680px; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; margin: 15px 0 18px; }
.chip { font: 400 10.5px/14px var(--head); letter-spacing: 1.1px; padding: 9px 12px; min-height: 36px; border-radius: 18px; background: #F5EEDF; color: var(--burgundy); }
.chip.on { background: var(--burgundy); color: var(--cream); }
.layout { display: grid; grid-template-columns: minmax(0, 390px) minmax(0, 1fr); gap: 34px; align-items: start; }
.side { min-width: 0; }
.side h2 { font: 400 12px var(--head); letter-spacing: 2px; color: var(--burgundy); }
.side .why { margin-top: 5px; color: var(--stageInk); max-width: 520px; }
.steps { list-style: none; margin-top: 18px; display: grid; gap: 1px; max-width: 420px; }
.steps button { display: flex; gap: 10px; width: 100%; min-height: 34px; padding: 5px 8px; border-radius: 6px; color: var(--stageMuted); font-size: 16px; line-height: 21px; }
.steps button i { font: 400 11px/21px var(--head); width: 18px; color: var(--goldDeep); font-style: normal; font-variant-numeric: tabular-nums; }
.steps button.on { background: #F5EEDF; color: var(--ink); }

/* phone */
.phone { position: relative; width: 100%; height: 800px; border-radius: 42px; background: var(--bg); overflow: hidden; box-shadow: 0 0 0 8px #15120E, 0 22px 44px rgba(40,28,10,.3); }
.status { position: absolute; z-index: 30; top: 15px; left: 32px; right: 30px; display: flex; justify-content: space-between; color: var(--ink); font: 600 14px -apple-system, system-ui, sans-serif; pointer-events: none; }
.phone.onart .status { color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.45); }
.phone.onart.scrolled .status { color: var(--ink); text-shadow: none; background: #fff; }
.phone.scrolled .status { top: 0; left: 0; right: 0; padding: 15px 30px 9px 32px; background: #fff; }
.island { position: absolute; z-index: 31; top: 10px; left: 50%; width: 112px; height: 31px; margin-left: -56px; border-radius: 18px; background: #000; }
.view { position: absolute; inset: 0; overflow-y: auto; background: var(--bg); padding-bottom: 150px; scrollbar-width: none; animation: rise .26s ease-out; }
.view.dark { background: #1F1B17; color: var(--cream); }
.view::-webkit-scrollbar, .car::-webkit-scrollbar, .row::-webkit-scrollbar { display: none; }
@keyframes rise { from { opacity: .3; transform: translateX(10px); } to { opacity: 1; transform: none; } }

/* type, as the app's ladder */
.kicker { font: 400 14px/18px var(--head); letter-spacing: 1.6px; text-transform: uppercase; color: var(--ink); }
.title { font: italic 400 42px/48px var(--title); margin-top: 2px; text-wrap: balance; }
.lede { color: var(--muted); font-style: italic; font-size: 17px; line-height: 23px; margin-top: 6px; }
.label { font: 400 12.5px var(--head); letter-spacing: 1.8px; text-transform: uppercase; color: var(--ink); }
.rubric { font-style: italic; color: var(--burgundy); font-size: 17px; line-height: 22px; }
.pad { padding: 0 24px; }
.just { text-align: justify; hyphens: auto; font-size: 18.5px; line-height: 27px; }

/* the back row of a pushed page: chevron, then a hairline with a small red cross */
.navrow { display: flex; align-items: center; gap: 12px; padding: 50px 24px 0; height: 94px; }
.navrow .backb { width: 44px; height: 44px; margin-left: -12px; display: grid; place-items: center; }
.navrow .hair { flex: 1; height: 1px; background: var(--line); position: relative; }
.navrow .hair::after { content: "✠"; position: absolute; left: 50%; top: -9px; transform: translateX(-50%); background: var(--bg); padding: 0 8px; color: var(--burgundy); font-size: 12px; line-height: 18px; }
.head { padding: 14px 24px 18px; }
.mast img { display: block; width: 100%; }
.mast + .head { padding-top: 6px; }

/* painted choices: a rounded tile, its name set beneath in italic, as on Tradições */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 14px; padding: 0 24px; }
.tilec { display: block; min-width: 0; }
.tilec .img { display: block; width: 100%; aspect-ratio: 1; border-radius: 12px; background: #ddd center / cover; }
.tilec b { display: block; font: italic 400 22px/25px var(--title); margin-top: 9px; text-wrap: balance; }
.tilec small { display: block; font-style: italic; color: var(--muted); font-size: 14.5px; line-height: 18px; margin-top: 3px; }
.tiles.big .tilec b { font-size: 26px; line-height: 29px; }

/* a tradition's own page: the painting runs to the edges with its name over it */
.tpl { position: relative; height: 330px; background: #333 center / cover; display: flex; align-items: flex-end; padding: 0 24px 18px; color: #fff; }
.tpl::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.3), rgba(0,0,0,0) 26%, rgba(0,0,0,0) 48%, rgba(0,0,0,.62)); }
.tpl > div { position: relative; }
.tpl .kicker { color: rgba(255,255,255,.86); font-size: 12.5px; }
.tpl .title { font-size: 40px; line-height: 44px; color: #fff; }
.tpl.short { height: 262px; }
.tpl .backb { position: absolute; z-index: 2; top: 48px; left: 12px; width: 44px; height: 44px; display: grid; place-items: center; }
.tpl + .pad { padding-top: 20px; }

/* the rule as the plan sheet draws it: a bead per prayer on a swaying thread, its colour the hour's */
.string { position: relative; margin-top: 6px; }
.string svg.thread { position: absolute; left: 0; top: 0; pointer-events: none; }
.bead-row { position: relative; display: flex; align-items: center; width: 100%; min-height: 50px; padding-left: 52px; gap: 10px; }
.bead-row .nm { flex: 1; min-width: 0; font-size: 18px; line-height: 22px; }
.bead-row .nm small { display: block; font-style: italic; color: var(--muted); font-size: 14.5px; line-height: 18px; }
.bead-row .tm { color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
.bead-row.off .nm { color: #A89C8C; }
.bead-row.off .tm { color: #C2B8AA; }
.legend { display: flex; flex-wrap: wrap; gap: 2px 13px; color: var(--muted); font-size: 14px; margin-top: 2px; }
.legend i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }

/* rows of "Acrescentar à regra" */
.rgtitle { text-align: center; padding: 22px 24px 0; }
.rgtitle .t { font: 400 40px/46px var(--title); text-wrap: balance; }
.rgtitle .lede { margin-top: 12px; }
.rgtitle hr { border: 0; height: 1px; background: var(--line); margin: 22px 0 0; }
.gchap { position: relative; margin-top: 18px; padding: 36px 36px 30px; text-align: center; overflow: hidden; }
.gchap::before { content: ""; position: absolute; inset: 0; background: var(--art) center 30% / cover; opacity: .25; }
.gchap::after { content: ""; position: absolute; inset: -1px 0; background: linear-gradient(180deg, #fff, rgba(255,255,255,0) 32%, rgba(255,255,255,0) 58%, #fff); }
.gchap > * { position: relative; z-index: 1; }
.gchap .num { font: 400 12px var(--head); letter-spacing: 4px; color: var(--burgundy); }
.gchap .tt { font: italic 400 30px/38px var(--title); }
.gchap .ln { font-style: italic; color: var(--muted); font-size: 16px; line-height: 22px; }
.gchap .fl { color: var(--muted); font-size: 13px; letter-spacing: 8px; padding-top: 6px; }
.grow-row { display: flex; gap: 10px; width: 100%; padding: 14px 24px; align-items: flex-start; }
.grow-row + .grow-row { box-shadow: inset 0 .5px 0 var(--line); }
.grow-row .tx { flex: 1; min-width: 0; }
.grow-row b { display: block; font: 400 21px/26px var(--body); }
.grow-row em { display: block; font: 400 11px/16px var(--head); font-style: normal; letter-spacing: 1.8px; color: var(--gold); text-transform: uppercase; }
.grow-row small { display: block; font-style: italic; color: var(--muted); font-size: 15.5px; line-height: 21px; padding-top: 2px; }
.bead { flex: none; width: 40px; height: 40px; }
.addedbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 56px; color: var(--muted); font-size: 17px; }
.addedbar button { min-height: 44px; font: 400 13.5px var(--head); letter-spacing: 1.5px; color: var(--gold); }

/* the foot of a setup page */
.foot { position: absolute; z-index: 20; left: 0; right: 0; bottom: 0; padding: 34px 24px 22px; display: grid; gap: 2px; background: linear-gradient(180deg, rgba(255,255,255,0), #fff 30%); }
.foot.bar { background: #fff; box-shadow: inset 0 .5px 0 var(--line); padding: 4px 24px 18px; }
.foot.dark { background: linear-gradient(180deg, rgba(31,27,23,0), #1F1B17 30%); }
.btn { display: block; width: 100%; min-height: 52px; padding: 12px; border-radius: 10px; background: var(--gold); color: #fff; font: 400 14px var(--head); letter-spacing: 1.6px; text-transform: uppercase; text-align: center; }
.btn[disabled] { background: #E6DFD2; cursor: default; }
.link { display: block; width: 100%; min-height: 44px; padding: 11px; color: var(--gold); font: 400 13px var(--head); letter-spacing: 1.6px; text-transform: uppercase; text-align: center; }
.dots { display: flex; justify-content: center; gap: 7px; margin-bottom: 12px; }
.dots i { width: 6px; height: 6px; border-radius: 3px; background: #E2D9C9; }
.dots i.on { width: 20px; background: var(--gold); }

/* Office editions are books; the one chosen stands forward, the rest step back */
.books { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px 12px; padding: 0 24px; }
.bkbtn { display: block; min-width: 0; transition: opacity .15s; }
.bkbtn[aria-pressed="false"] { opacity: .42; }
.bkbtn > small { display: block; font-size: 13.5px; line-height: 16px; font-style: italic; color: var(--muted); text-align: center; margin-top: 7px; }
.bkbtn[aria-pressed="true"] > small { color: var(--ink); }
.bkbtn[aria-pressed="true"] .bk { box-shadow: 0 10px 20px rgba(60,40,15,.32); }

/* feature pages: a painted head, a line, and the thing itself */
.fobj { position: relative; height: 318px; margin: 18px 24px 0; }
.fobj .page, .fobj .map { box-shadow: 0 10px 26px rgba(60,45,20,.2); }
.fobj .page { background: #fff; }
.fobj .page::after { background: linear-gradient(180deg, rgba(255,255,255,0), #fff); }
.fobj .church { background: var(--surface); }
.fobj .hc { width: 92px; box-shadow: 0 8px 18px rgba(60,45,20,.3); }
.fobj .medt { width: 160px; height: 226px; box-shadow: 0 8px 18px rgba(60,45,20,.3); color: #fff; }
.fobj .fbook { width: 104px; }
.events { border-radius: 12px; background: var(--surface); padding: 12px 16px 6px; }
.events .eh { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding-bottom: 6px; box-shadow: inset 0 -.5px 0 #D9D2C6; }
.events .eh span { font: 400 10.5px var(--head); letter-spacing: 1.5px; color: var(--burgundy); text-transform: uppercase; }
.events .eh i { font-size: 13.5px; color: var(--muted); }
.ev { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; }
.ev + .ev { box-shadow: inset 0 .5px 0 #D9D2C6; }
.ev svg { flex: none; margin-top: 12px; }
.ev small { display: block; font: 400 9.5px var(--head); letter-spacing: 1.4px; color: var(--muted); text-transform: uppercase; }
.ev b { display: block; font: 400 17.5px/21px var(--body); }
.ev em { display: block; font-size: 14px; line-height: 18px; color: var(--muted); }

/* the prayer, as the prayer flow sets it */
.prayertitle { text-align: center; padding: 6px 24px 0; }
.prayertitle .t { font: 400 34px/40px var(--title); margin-top: 4px; }
.lines { font: 400 20.5px/31px var(--body); padding: 18px 24px 0; }
.amen { display: block; width: calc(100% - 48px); margin: 10px 24px 0; min-height: 60px; border-radius: 10px; background: var(--gold); color: #fff; font: italic 400 30px/40px var(--title); text-align: center; }
.amen + .note { margin-top: 10px; }

/* the received card, as the app shows it */
.cardtop { background: #1F1B17; color: var(--cream); padding: 64px 24px 22px; text-align: center; }
.bigcard { display: block; width: 62%; aspect-ratio: 2/3; object-fit: cover; margin: 0 auto; border-radius: 8px; box-shadow: 0 14px 30px rgba(0,0,0,.6); }
.cardtop .nm { font: 400 26px/31px var(--title); margin-top: 16px; }
.cardtop .dt { font: 400 11px var(--head); letter-spacing: 1.6px; color: var(--label); margin-top: 3px; }
.cardtop .po { font-style: italic; color: var(--creamSoft); font-size: 16px; margin-top: 2px; }
.quote { text-align: center; font-style: italic; font-size: 18.5px; line-height: 26px; padding: 14px 34px 0; }
.picks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 12px; padding: 0 24px; }
.pick { display: block; min-width: 0; text-align: center; }
.pick img { display: block; width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 5px; box-shadow: 0 4px 10px rgba(60,45,20,.22); }
.pick span { display: block; font: 400 9.5px/12px var(--head); letter-spacing: .8px; text-transform: uppercase; margin-top: 6px; }
.envcard { position: relative; width: 262px; height: 350px; margin: 22px auto 0; border-radius: 17px; overflow: hidden; padding: 17px; display: flex; flex-direction: column; justify-content: flex-end; color: var(--cream); background: #17171C; text-align: left; }
.envcard .env { position: absolute; top: 72px; left: 40px; width: 182px; transform: rotate(90deg); }
.envcard small, .envcard b, .envcard span { position: relative; display: block; }
.envcard small { font: 400 10.5px var(--head); letter-spacing: 1.5px; color: rgba(245,239,226,.72); text-transform: uppercase; }
.envcard b { font: 400 23px/27px var(--title); margin-top: 2px; }
.envcard span { color: var(--creamSoft); font-size: 15px; line-height: 19px; margin-top: 3px; }

/* reminders: the day's parts, each with its bell */
.moment { display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 0; box-shadow: inset 0 -.5px 0 var(--line); }
.moment .tx { flex: 1; min-width: 0; }
.moment .label { display: flex; gap: 10px; align-items: baseline; }
.moment .label span { font: 400 15px var(--body); letter-spacing: 0; color: var(--muted); }
.moment small { display: block; font-size: 16px; line-height: 21px; color: var(--muted); margin-top: 2px; }
.moment.off .label, .moment.off small { color: #B5AA9B; }

.wax { display: grid; place-items: center; border-radius: 48% 52% 50% 50%; color: var(--label); background: radial-gradient(circle at 38% 34%, #B23A3A, #7D1A1E 62%, #5E1114); box-shadow: 0 2px 5px rgba(0,0,0,.45); }
.bk { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; aspect-ratio: 2/3; padding: 12% 11% 8% 17%; border-radius: 2px 5px 5px 2px; overflow: hidden; color: var(--cream); text-align: center; background: linear-gradient(155deg, var(--from), var(--to)); box-shadow: 0 7px 14px rgba(40,25,10,.38); }
.bk::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.42), rgba(0,0,0,.14) 4%, rgba(255,255,255,.14) 5%, rgba(0,0,0,.2) 8%, transparent 13%); }
.bk::after { content: ""; position: absolute; inset: 6% 7% 5% 14%; border: 1px solid rgba(232,201,122,.55); }
.bk i { position: relative; color: var(--label); font-style: normal; font-size: 12px; margin-bottom: 5px; }
.bk b { position: relative; font: 600 12.5px/14px var(--body); }
.bk em { position: relative; margin-top: 4px; color: var(--label); font: 400 7px/9px var(--head); letter-spacing: .6px; font-style: normal; }
.page { position: absolute; top: 0; left: 0; right: 0; max-height: 100%; overflow: hidden; border-radius: 10px; padding: 18px 19px; background: #FFFDF8; color: var(--ink); box-shadow: 0 18px 38px rgba(0,0,0,.5); }
.page::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 16px; background: linear-gradient(180deg, rgba(255,253,248,0), #FFFDF8); }
.page .t { font: 400 21px/25px var(--title); text-align: center; }
.rub { font: 400 10.5px var(--head); letter-spacing: 1.6px; color: #9E2A2B; margin-top: 13px; text-transform: uppercase; }
.page p { font-size: 16px; line-height: 22px; margin-top: 3px; }
.page .c { text-align: center; font-size: 13.5px; color: var(--muted); font-style: italic; margin-top: 0; }
.hrow { display: flex; gap: 4px; justify-content: center; margin-top: 9px; }
.hrow span { font: 400 8.5px var(--head); letter-spacing: .6px; padding: 5px 6px; border-radius: 10px; background: #F1E8D3; color: var(--muted); }
.hrow span.on { background: #9E2A2B; color: var(--cream); }
.map { position: absolute; left: 0; right: 0; top: 0; height: 232px; border-radius: 13px; overflow: hidden; background: #EFE7D6; box-shadow: 0 14px 30px rgba(0,0,0,.45); }
.mappin { position: absolute; width: 27px; height: 27px; transform: translate(-50%, -50%); border-radius: 50%; color: var(--label); background: var(--burgundy); box-shadow: 0 3px 7px rgba(40,25,10,.42); display: grid; place-items: center; font-size: 13px; }
.mappin::after { content: "✠"; }
.me { position: absolute; width: 15px; height: 15px; margin: -7px; border-radius: 50%; background: #3D7BD9; box-shadow: 0 0 0 3px #fff, 0 0 0 11px rgba(61,123,217,.2); }
.churches { position: absolute; left: 0; right: 0; top: 242px; display: grid; gap: 7px; }
.church { display: flex; gap: 12px; align-items: center; padding: 8px 14px; border-radius: 11px; background: #FFFDF8; color: var(--ink); }
.church span { width: 54px; flex: none; font: 400 19px var(--title); color: var(--burgundy); }
.church b { display: block; font: 400 16.5px/19px var(--title); }
.church small { display: block; color: var(--muted); font-size: 13.5px; line-height: 15px; font-style: italic; }
.fbook { position: absolute; width: 132px; }
.fbook .bk b { font-size: 16px; line-height: 18px; }
.fbook .bk em { font-size: 8px; line-height: 10px; }
.hc { position: absolute; width: 186px; aspect-ratio: 2/3; object-fit: cover; border-radius: 9px; box-shadow: 0 16px 32px rgba(0,0,0,.6); }
.medt { position: absolute; width: 186px; height: 262px; border-radius: 14px; overflow: hidden; background: center / cover; box-shadow: 0 16px 32px rgba(0,0,0,.55); }
.medt::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 42%, rgba(0,0,0,.88)); }
.medt b { position: absolute; z-index: 1; left: 12px; right: 10px; bottom: 11px; font: 600 18px/21px var(--body); }
.env { position: relative; width: 100%; aspect-ratio: 1.46; border-radius: 5px; overflow: hidden; background: #f1e3c2 url(a/envelope-paper.webp) center / cover; background-blend-mode: multiply; box-shadow: 0 16px 34px rgba(0,0,0,.55); }
.env .flap { position: absolute; inset: 0 0 auto; height: 53%; clip-path: polygon(0 0, 100% 0, 50% 100%); background: #e6d6b2; }
.env .from { position: absolute; top: 7%; left: 0; right: 0; text-align: center; color: #7D6647; font: 400 9.5px var(--head); letter-spacing: 1.2px; }
.env .wax { position: absolute; top: 53%; left: 50%; width: 21%; aspect-ratio: 1; transform: translate(-50%, -50%); font-size: 21px; }
.env .wax.press { animation: stamp .42s cubic-bezier(.3,1.5,.5,1) both .18s; }
@keyframes stamp { from { transform: translate(-50%, -50%) scale(2.1); opacity: 0; } to { transform: translate(-50%, -50%); opacity: 1; } }
.env .to { position: absolute; left: 0; right: 0; bottom: 9%; text-align: center; font: italic 400 19px var(--title); color: #3A2C1C; }
.tom { display: flex; gap: 12px; align-items: center; padding: 8px 0; border-top: 1px solid rgba(245,239,226,.16); }
.tom img { width: 35px; height: 52px; object-fit: cover; border-radius: 3px; flex: none; }
.tom small { display: block; font: 400 9.5px var(--head); letter-spacing: 1.2px; color: var(--label); }
.tom b { display: block; font: 400 17px/20px var(--title); }
/* Today */
.today { padding: 0 22px 110px; }
.thead { position: relative; padding-top: 104px; }

  const view = document.querySelector('#screen .view')
  // The status bar sits on the painting at first, then on white once the page has scrolled under it.
  view.addEventListener('scroll', () => phone.classList.toggle('scrolled', view.scrollTop > (s.onart ? 230 : 40)))
  document.getElementById('overlay').innerHTML = ''
  document.getElementById('chips').innerHTML = Object.entries(paths).map(([k, p]) => `<button class="chip ${k === path && step > 0 ? 'on' : ''}" data-jump="${k}">${p.label}</button>`).join('')
  document.getElementById('pathName').textContent = step ? `${paths[path].label} · ${label}` : label
  document.getElementById('why').textContent = (g && whyAlt[g]?.[alt[g]] && !(g === 'features' && alt.features === 'A')) ? whyAlt[g][alt[g]] : why[whyKey] || why[key]
  document.getElementById('alts').innerHTML = Object.entries(altGroups).map(([k, gr]) => `<div class="altrow ${k === g ? 'here' : ''}"><span>${gr.label}</span>${Object.entries(gr.opts).map(([o, l]) => `<button class="${alt[k] === o ? 'on' : ''}" data-alt="${k}" data-opt="${o}" aria-pressed="${alt[k] === o}">${o} · ${l}</button>`).join('')}</div>`).join('')
  document.getElementById('steps').innerHTML = stepsOf(path).map((k, i) => { const fi = { f1: 0, f2: 1, f3: 2 }[k]; const n = fi === undefined ? names[k] : alt.features === 'B' ? tourNames[fi] : featureNames[paths[path].features[fi]]; return `<li><button class="${i === step ? 'on' : ''}" data-step="${i}"><i>${i + 1}</i>${n}</button></li>` }).join('')
}
function setPath(p, at = 0) { path = p; step = at; render() }
function next() { step = Math.min(step + 1, stepsOf(path).length - 1); render() }
const toggle = (set, v) => (set.has(v) ? set.delete(v) : set.add(v))
// Re-render in place, keeping the scroll, for a change on the same screen.
const keep = () => { const v = document.querySelector('.view'); const y = v ? v.scrollTop : 0; render(); const n = document.querySelector('.view'); if (n) { n.style.animation = 'none'; n.scrollTop = y } }

document.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return
  if (b.dataset.alt) {
    const was = stepsOf(path)[step]; alt[b.dataset.alt] = b.dataset.opt
    const now = stepsOf(path); let i = now.indexOf(was)
    if (i < 0) i = now.findIndex((k) => groupOf(k) === b.dataset.alt)
    if (i >= 0 && step > 0) step = i
    return render()
  }
  if (b.dataset.jump) { state = fresh(); return setPath(b.dataset.jump, 1) }
  if (b.dataset.step !== undefined) { step = Number(b.dataset.step); return render() }
  if ('back' in b.dataset) { step = Math.max(step - 1, 0); return render() }
  if ('next' in b.dataset) return next()
  const { act, val } = b.dataset
  if (act === 'path') { state = fresh(); return setPath(val === 'office' ? 'office-regular' : val, 1) }
  if (act === 'officePath') { path = val; return next() }
  if (act === 'office') { state.office = val; state.hours = new Set(['Laudes', 'Vésperas', 'Completas']); return keep() }
  if (act === 'hour') { toggle(state.hours, val); return keep() }
  if (act === 'firstHour') { state.firstHour = val; return keep() }
  if (act === 'rule') { state.rule = val; state.off = new Set(); return next() }
  if (act === 'ruleItem') { toggle(state.off, Number(val)); return keep() }
  if (act === 'mine') { toggle(state.mine, val); return keep() }
  if (act === 'muteOne') { toggle(state.mutedOne, val); return keep() }
  if (act === 'mute') { toggle(state.muted, val); return keep() }
  if (act === 'no-notify') { state.allowed = false; return next() }
  if (act === 'skipFeatures') { step = stepsOf(path).indexOf('pray'); return render() }
  if (act === 'remind-yes') { document.getElementById('overlay').innerHTML = alertHtml; return }
  if (act === 'ask-notify') { document.getElementById('overlay').innerHTML = alertHtml; return }
  if (false) { document.getElementById('overlay').innerHTML = `<div class="scrim"><div class="alert"><div><h4>“Ember” Deseja Enviar Notificações</h4><p>Lembretes do seu plano de vida, na hora de cada oração.</p></div><div class="bt"><button data-act="deny">Não Permitir</button><button data-act="allow">Permitir</button></div></div></div>`; return }
  if (act === 'allow') { state.allowed = true; return next() }
  if (act === 'deny') { state.allowed = false; return next() }
  if (act === 'card') { state.card = val; return next() }
})
setPath('start', 0)
</script>
