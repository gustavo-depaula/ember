<title>Ember First Steps</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: every setup screen is led by a painting; choices are pictures, sealed with wax when chosen. */
:root {
  color-scheme: light;
  --bg: #fff; --ink: #2C2418; --muted: #6B5D4F; --gold: #C9A84C; --goldDeep: #A8872E; --line: #E5DDD2;
  --burgundy: #6B1D2A; --parch: #F1E8D3; --cream: #F5EFE2; --creamSoft: rgba(245,239,226,.8); --label: #E8C97A;
  --night: #14100C; --green: #1E4A32; --stage: #E4DCCB; --stageInk: #4A3C22; --stageMuted: #5D5039;
  --head: Cinzel, Georgia, serif; --title: Junicode, Garamond, Georgia, serif; --body: Garamond, Georgia, serif;
}
@font-face { font-family: Garamond; src: url(a/EBGaramond_400Regular.woff2); font-display: swap; }
@font-face { font-family: Garamond; font-weight: 600; src: url(a/EBGaramond_600.ttf); font-display: swap; }
@font-face { font-family: Garamond; font-style: italic; src: url(a/EBGaramond_400Regular_Italic.woff2); font-display: swap; }
@font-face { font-family: Cinzel; src: url(a/Cinzel_400Regular.woff2); font-display: swap; }
@font-face { font-family: Junicode; src: url(a/Junicode.woff2); font-display: swap; }
@font-face { font-family: Junicode; font-style: italic; src: url(a/Junicode-Italic.woff2); font-display: swap; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--stage); color: var(--ink); font: 18px/25px var(--body); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: left; }
button:focus-visible { outline: 2px solid var(--label); outline-offset: 2px; }
.wrap { max-width: 1040px; margin: 0 auto; padding-block: 22px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top h1 { font: italic 400 31px/37px var(--title); }
.top p { color: var(--stageMuted); margin-top: 3px; max-width: 680px; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; margin: 15px 0 18px; }
.chip { font: 400 10.5px/14px var(--head); letter-spacing: 1.1px; padding: 9px 12px; min-height: 36px; border-radius: 18px; background: #F5EEDF; color: var(--burgundy); }
.chip.on { background: var(--burgundy); color: var(--cream); }
.layout { display: grid; grid-template-columns: minmax(0, 390px) minmax(0, 1fr); gap: 34px; align-items: start; }
.side { min-width: 0; }
.side h2 { font: 400 12px var(--head); letter-spacing: 2px; color: var(--burgundy); }
.side .why { margin-top: 5px; color: var(--stageInk); max-width: 520px; }
.steps { list-style: none; margin-top: 18px; display: grid; gap: 1px; max-width: 420px; }
.steps button { display: flex; gap: 10px; width: 100%; min-height: 34px; padding: 5px 8px; border-radius: 6px; color: var(--stageMuted); font-size: 16px; line-height: 21px; }
.steps button i { font: 400 11px/21px var(--head); width: 18px; color: var(--goldDeep); font-style: normal; font-variant-numeric: tabular-nums; }
.steps button.on { background: #F5EEDF; color: var(--ink); }

/* phone */
.phone { position: relative; width: 100%; height: 800px; border-radius: 42px; background: var(--night); overflow: hidden; box-shadow: 0 0 0 8px #15120E, 0 22px 44px rgba(40,28,10,.3); }
.status { position: absolute; z-index: 30; top: 15px; left: 32px; right: 30px; display: flex; justify-content: space-between; color: var(--cream); font: 600 14px -apple-system, system-ui, sans-serif; pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
.phone.light .status { color: var(--ink); text-shadow: none; }
.island { position: absolute; z-index: 31; top: 10px; left: 50%; width: 112px; height: 31px; margin-left: -56px; border-radius: 18px; background: #000; }
.view { position: absolute; inset: 0; overflow-y: auto; background: var(--bg); padding-bottom: 136px; scrollbar-width: none; animation: rise .32s ease-out; }
.view.dark { background: var(--night); color: var(--cream); }
.view::-webkit-scrollbar, .car::-webkit-scrollbar, .row::-webkit-scrollbar, .prayer::-webkit-scrollbar { display: none; }
@keyframes rise { from { opacity: .25; transform: scale(1.018); } to { opacity: 1; transform: none; } }
.back { position: absolute; z-index: 26; top: 50px; left: 14px; width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; color: var(--cream); background: rgba(20,16,12,.42); font-size: 25px; line-height: 1; text-align: center; }
.foot { position: absolute; z-index: 20; left: 0; right: 0; bottom: 0; padding: 30px 22px 24px; display: grid; gap: 3px; background: linear-gradient(180deg, rgba(255,255,255,0), #fff 30%); }
.foot.dark { background: linear-gradient(180deg, rgba(20,16,12,0), rgba(20,16,12,.94) 34%); color: var(--cream); }
.btn { display: block; width: 100%; min-height: 54px; padding: 13px; border-radius: 12px; background: var(--burgundy); color: var(--cream); font: 400 13px var(--head); letter-spacing: 1.7px; text-align: center; text-transform: uppercase; }
.foot.dark .btn { background: var(--gold); color: #22180A; }
.foot .btn[disabled] { background: #DDD5C8; color: #fff; cursor: default; }
.link { display: block; width: 100%; min-height: 42px; padding: 10px; color: var(--goldDeep); font: 400 11.5px var(--head); letter-spacing: 1.4px; text-align: center; text-transform: uppercase; }
.foot.dark .link { color: var(--label); }
.eyebrow { font: 400 11px var(--head); letter-spacing: 2px; color: var(--label); text-transform: uppercase; }
.h { font: 400 37px/42px var(--title); margin-top: 3px; text-wrap: balance; }
.h i { font-style: italic; }

/* a page's painted head */
.cover { position: relative; height: 332px; background: #1d1711 center / cover; color: var(--cream); display: flex; flex-direction: column; justify-content: flex-end; padding: 0 24px 20px; }
.cover.short { height: 268px; }
.cover::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(15,11,7,.28), rgba(15,11,7,0) 24%, rgba(15,11,7,.2) 48%, rgba(15,11,7,.9)); }
.cover > * { position: relative; }
.cover p { color: var(--creamSoft); font-size: 17px; line-height: 22px; margin-top: 5px; }
.pad { padding: 16px 22px 0; }

/* the doors */
.askhead { padding: 72px 24px 15px; }
.doors { display: grid; gap: 9px; padding: 0 14px; }
.door { position: relative; display: flex; width: 100%; height: 137px; border-radius: 14px; overflow: hidden; align-items: flex-end; padding: 13px 16px; background: #222 center / cover; color: var(--cream); }
.door::before { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(14,10,7,.86), rgba(14,10,7,.3) 50%, rgba(14,10,7,0) 74%); }
.door span { position: relative; display: block; max-width: 86%; }
.door b { display: block; font: 400 23px/26px var(--title); text-wrap: balance; }
.door small { display: block; color: var(--creamSoft); font-size: 15.5px; line-height: 19px; margin-top: 2px; }

/* picture choices */
.pics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pic { position: relative; display: block; width: 100%; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: #222 center / cover; color: var(--cream); transition: filter .18s; }
.pic.wide { grid-column: 1 / -1; aspect-ratio: 1.75; }
.pic::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(14,10,7,0) 42%, rgba(14,10,7,.88)); }
.pic.idle { filter: saturate(.82) brightness(.9); }
.pic .cap { position: absolute; left: 11px; right: 9px; bottom: 9px; }
.pic b { display: block; font: 400 18px/20px var(--title); }
.pic.wide b { font-size: 25px; line-height: 28px; }
.pic small { display: block; color: var(--creamSoft); font-size: 13.5px; line-height: 16px; margin-top: 2px; }
.wax { display: grid; place-items: center; border-radius: 48% 52% 50% 50%; color: var(--label); background: radial-gradient(circle at 38% 34%, #B23A3A, #7D1A1E 62%, #5E1114); box-shadow: 0 2px 5px rgba(0,0,0,.45); }
.pic .wax, .bk .wax { position: absolute; top: 8px; right: 8px; width: 33px; height: 33px; font-size: 15px; z-index: 6; animation: press .22s ease-out; }
.bk .wax { top: 5px; right: 5px; width: 27px; height: 27px; font-size: 12px; }
@keyframes press { from { transform: scale(1.7); opacity: 0; } to { transform: none; opacity: 1; } }

/* an Office edition is a book */
.books { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px 11px; }
.bkbtn { display: block; min-width: 0; }
.bkbtn > small { display: block; font-size: 13.5px; line-height: 16px; color: var(--muted); text-align: center; margin-top: 6px; }
.bk { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; aspect-ratio: 2/3; padding: 12% 11% 8% 17%; border-radius: 2px 5px 5px 2px; overflow: hidden; color: var(--cream); text-align: center; background: linear-gradient(155deg, var(--from), var(--to)); box-shadow: 0 7px 14px rgba(40,25,10,.38); }
.bk::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.42), rgba(0,0,0,.14) 4%, rgba(255,255,255,.14) 5%, rgba(0,0,0,.2) 8%, transparent 13%); }
.bk::after { content: ""; position: absolute; inset: 6% 7% 5% 14%; border: 1px solid rgba(232,201,122,.55); }
.bk i { position: relative; color: var(--label); font-style: normal; font-size: 12px; margin-bottom: 5px; }
.bk b { position: relative; font: 600 12.5px/14px var(--body); }
.bk em { position: relative; margin-top: 4px; color: var(--label); font: 400 7px/9px var(--head); letter-spacing: .6px; font-style: normal; }

/* the day, from dawn to night */
.day { position: relative; padding-left: 26px; }
.day::before { content: ""; position: absolute; left: 7px; top: 22px; bottom: 22px; width: 2px; background: linear-gradient(180deg, #E9C66F, #D98B45 58%, #4C3B6B 78%, #1E2547); }
.slot { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 7px 0; }
.slot + .slot { border-top: 1px solid var(--line); }
.slot .dot { position: absolute; left: -26px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 2px #D8CBB5; }
.slot.on .dot { width: 20px; height: 20px; left: -28px; background: radial-gradient(circle at 38% 34%, #B23A3A, #7D1A1E 62%, #5E1114); box-shadow: 0 1px 3px rgba(0,0,0,.35); }
.slot .tm { width: 51px; flex: none; font: 400 14px var(--head); color: var(--goldDeep); font-variant-numeric: tabular-nums; }
.slot .tx { flex: 1; min-width: 0; }
.slot b { display: block; font: 400 19px/22px var(--title); }
.slot small { display: block; color: var(--muted); font-size: 15px; line-height: 18px; }
.slot.idle b, .slot.idle .tm { color: #B9AE9E; }
.sub { font: 400 11px var(--head); letter-spacing: 2px; color: var(--muted); margin: 19px 0 5px; text-transform: uppercase; }
.small { color: var(--muted); font-size: 16px; line-height: 21px; }

.hours3 { display: grid; gap: 9px; }
.hours3 .pic { aspect-ratio: auto; height: 108px; }
.hours3 .pic::before { background: linear-gradient(90deg, rgba(14,10,7,.76), rgba(14,10,7,.04) 76%); }
.hours3 .cap { top: 50%; bottom: auto; transform: translateY(-50%); }
.hours3 b { font-size: 23px; line-height: 26px; }

.nextstep { position: relative; min-height: 640px; background: center / cover; color: var(--cream); display: flex; flex-direction: column; justify-content: flex-end; padding: 0 24px 12px; }
.nextstep::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(15,11,7,.18), rgba(15,11,7,.14) 38%, rgba(15,11,7,.94)); }
.nextstep > * { position: relative; }
.nextstep p { color: var(--creamSoft); margin-top: 7px; font-size: 18px; line-height: 24px; }

/* feature pages: the feature itself, on its painting */
.feature { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; background: var(--night); color: var(--cream); }
.feature .bgimg { position: absolute; inset: 0; background: center / cover; animation: drift 9s ease-out both; }
@keyframes drift { from { transform: scale(1.09); } to { transform: scale(1); } }
.feature::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(14,10,7,.34), rgba(14,10,7,.28) 42%, rgba(14,10,7,.9) 66%, rgba(14,10,7,.98)); }
.fobj { position: relative; z-index: 2; flex: 1; min-height: 0; margin: 70px 22px 16px; }
.fcopy { position: relative; z-index: 3; padding: 0 24px 160px; }
.fcopy p { color: var(--creamSoft); font-size: 17.5px; line-height: 23px; margin-top: 6px; }
.dots { display: flex; justify-content: center; gap: 7px; margin-bottom: 11px; }
.dots i { width: 7px; height: 7px; border-radius: 4px; background: rgba(245,239,226,.32); }
.dots i.on { width: 22px; background: var(--label); }
.page { position: absolute; top: 0; left: 0; right: 0; max-height: 100%; overflow: hidden; border-radius: 10px; padding: 18px 19px; background: #FFFDF8; color: var(--ink); box-shadow: 0 18px 38px rgba(0,0,0,.5); }
.page::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 16px; background: linear-gradient(180deg, rgba(255,253,248,0), #FFFDF8); }
.page .t { font: 400 21px/25px var(--title); text-align: center; }
.rub { font: 400 10.5px var(--head); letter-spacing: 1.6px; color: #9E2A2B; margin-top: 13px; text-transform: uppercase; }
.page p { font-size: 16px; line-height: 22px; margin-top: 3px; }
.page .c { text-align: center; font-size: 13.5px; color: var(--muted); font-style: italic; margin-top: 0; }
.hrow { display: flex; gap: 4px; justify-content: center; margin-top: 9px; }
.hrow span { font: 400 8.5px var(--head); letter-spacing: .6px; padding: 5px 6px; border-radius: 10px; background: #F1E8D3; color: var(--muted); }
.hrow span.on { background: #9E2A2B; color: var(--cream); }
.map { position: absolute; left: 0; right: 0; top: 0; height: 232px; border-radius: 13px; overflow: hidden; background: #EFE7D6; box-shadow: 0 14px 30px rgba(0,0,0,.45); }
.mappin { position: absolute; width: 27px; height: 27px; transform: translate(-50%, -50%); border-radius: 50%; color: var(--label); background: var(--burgundy); box-shadow: 0 3px 7px rgba(40,25,10,.42); display: grid; place-items: center; font-size: 13px; }
.mappin::after { content: "✠"; }
.me { position: absolute; width: 15px; height: 15px; margin: -7px; border-radius: 50%; background: #3D7BD9; box-shadow: 0 0 0 3px #fff, 0 0 0 11px rgba(61,123,217,.2); }
.churches { position: absolute; left: 0; right: 0; top: 242px; display: grid; gap: 7px; }
.church { display: flex; gap: 12px; align-items: center; padding: 8px 14px; border-radius: 11px; background: #FFFDF8; color: var(--ink); }
.church span { width: 54px; flex: none; font: 400 19px var(--title); color: var(--burgundy); }
.church b { display: block; font: 400 16.5px/19px var(--title); }
.church small { display: block; color: var(--muted); font-size: 13.5px; line-height: 15px; font-style: italic; }
.fbook { position: absolute; width: 132px; }
.fbook .bk b { font-size: 16px; line-height: 18px; }
.fbook .bk em { font-size: 8px; line-height: 10px; }
.hc { position: absolute; width: 186px; aspect-ratio: 2/3; object-fit: cover; border-radius: 9px; box-shadow: 0 16px 32px rgba(0,0,0,.6); }
.medt { position: absolute; width: 186px; height: 262px; border-radius: 14px; overflow: hidden; background: center / cover; box-shadow: 0 16px 32px rgba(0,0,0,.55); }
.medt::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 42%, rgba(0,0,0,.88)); }
.medt b { position: absolute; z-index: 1; left: 12px; right: 10px; bottom: 11px; font: 600 18px/21px var(--body); }

/* the common last prayer */
.prayer { position: absolute; inset: 0; overflow-y: auto; background-color: var(--night); background-position: center; background-size: cover; color: var(--cream); text-align: center; padding: 96px 26px 28px; scrollbar-width: none; }
.prayer .lines { font: 400 21px/31px var(--body); margin-top: 15px; }
.prayer .tip { color: var(--label); font-style: italic; font-size: 16.5px; line-height: 21px; margin-top: 15px; }
.amenbtn { display: block; width: 100%; margin-top: 11px; padding: 9px 0 13px; border-radius: 13px; background: var(--gold); color: #22180A; font: italic 400 36px/42px var(--title); text-align: center; animation: invite 2.4s ease-in-out 1.2s infinite; }
@keyframes invite { 0%, 100% { transform: none; } 50% { transform: scale(1.022); } }

/* envelope and cards */
.env { position: relative; width: 100%; aspect-ratio: 1.46; border-radius: 5px; overflow: hidden; background: #f1e3c2 url(a/envelope-paper.webp) center / cover; background-blend-mode: multiply; box-shadow: 0 16px 34px rgba(0,0,0,.55); }
.env .flap { position: absolute; inset: 0 0 auto; height: 53%; clip-path: polygon(0 0, 100% 0, 50% 100%); background: #e6d6b2; }
.env .from { position: absolute; top: 7%; left: 0; right: 0; text-align: center; color: #7D6647; font: 400 9.5px var(--head); letter-spacing: 1.2px; }
.env .wax { position: absolute; top: 53%; left: 50%; width: 21%; aspect-ratio: 1; transform: translate(-50%, -50%); font-size: 21px; }
.env .wax.press { animation: stamp .42s cubic-bezier(.3,1.5,.5,1) both .18s; }
@keyframes stamp { from { transform: translate(-50%, -50%) scale(2.1); opacity: 0; } to { transform: translate(-50%, -50%); opacity: 1; } }
.env .to { position: absolute; left: 0; right: 0; bottom: 9%; text-align: center; font: italic 400 19px var(--title); color: #3A2C1C; }
.picks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 13px 9px; padding: 0 16px; margin-top: 2px; }
.pick { display: block; min-width: 0; text-align: center; color: var(--cream); }
.pick img { display: block; width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 5px; box-shadow: 0 6px 12px rgba(0,0,0,.5); }
.pick span { display: block; font: 400 12.5px/15px var(--title); margin-top: 5px; }
.bigcard { display: block; width: 58%; aspect-ratio: 2/3; object-fit: cover; margin: 60px auto 0; border-radius: 9px; box-shadow: 0 16px 34px rgba(0,0,0,.65); }
.tom { display: flex; gap: 12px; align-items: center; padding: 8px 0; border-top: 1px solid rgba(245,239,226,.16); }
.tom img { width: 35px; height: 52px; object-fit: cover; border-radius: 3px; flex: none; }
.tom small { display: block; font: 400 9.5px var(--head); letter-spacing: 1.2px; color: var(--label); }
.tom b { display: block; font: 400 17px/20px var(--title); }

/* Today */
.today { padding: 0 22px 110px; }
.thead { position: relative; padding-top: 104px; }
.thead .lab { position: relative; font: 400 12px var(--head); letter-spacing: 1.4px; }
.thead .date { position: relative; font: italic 400 38px/46px var(--title); }
.thead .date span { font-style: normal; color: #C8BCA8; font-size: 21px; margin-left: 9px; }
.corner { position: absolute; top: -14px; right: -38px; width: 390px; max-width: none; transform: scaleX(-1); pointer-events: none; }
.car { display: flex; gap: 12px; margin: 14px -22px 0; padding: 0 22px 8px; overflow-x: auto; scrollbar-width: none; }
.hero { position: relative; flex: 0 0 262px; height: 350px; border-radius: 17px; overflow: hidden; padding: 17px; display: flex; flex-direction: column; justify-content: flex-end; color: var(--cream); background: #17171C center / cover; }
.hero.art::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 38%, rgba(0,0,0,.88)); }
.hero > small, .hero > b, .hero > span { position: relative; }
.hero small { font: 400 10.5px var(--head); letter-spacing: 1.5px; color: rgba(245,239,226,.72); text-transform: uppercase; }
.hero b { font: 400 23px/27px var(--title); margin-top: 2px; }
.hero > span { color: rgba(245,239,226,.8); font-size: 15px; line-height: 19px; margin-top: 3px; }
.hero .env { position: absolute; top: 72px; left: 40px; width: 182px; transform: rotate(90deg); }
.stamp { width: 148px; height: 148px; flex: none; display: grid; place-content: center; text-align: center; padding: 14px; color: var(--cream); background: linear-gradient(145deg, var(--from), var(--to)); -webkit-mask: linear-gradient(#000 0 0) center / calc(100% - 10px) calc(100% - 10px) no-repeat, radial-gradient(circle 4px, transparent 96%, #000) -6px -6px / 12px 12px; mask: linear-gradient(#000 0 0) center / calc(100% - 10px) calc(100% - 10px) no-repeat, radial-gradient(circle 4px, transparent 96%, #000) -6px -6px / 12px 12px; }
.stamp b { font: 600 17px/20px var(--body); }
.stamp small { font: 400 8.5px var(--head); letter-spacing: 1px; opacity: .75; margin-top: 3px; }
.row { display: flex; gap: 12px; margin: 13px -22px 0; padding: 0 22px 4px; overflow-x: auto; scrollbar-width: none; }
.tile { flex: none; width: 148px; display: block; }
.tile > small { display: block; font: 400 12px/15px var(--head); margin-top: 7px; }
.plan { width: 148px; height: 148px; border-radius: 6px; overflow: hidden; background: linear-gradient(180deg, #F3EAD6, #E9DAB9); }
.plan .band { display: flex; justify-content: space-between; padding: 7px 11px; color: var(--cream); font: 400 8.5px var(--head); letter-spacing: 1.2px; background: var(--green); }
.plan.empty .band { background: #6B1620; }
.plan b { display: block; padding: 6px 11px 1px; font: 600 17px/20px var(--body); }
.plan ul { list-style: none; padding: 1px 11px; }
.plan li { font: 400 8px/13px var(--head); letter-spacing: .6px; color: #6B1D2A; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plan p { padding: 3px 11px; font-size: 14px; line-height: 17px; font-style: italic; color: var(--muted); }
.shelf { font: 400 16px var(--head); letter-spacing: 1.2px; margin-top: 22px; }
.med { flex: 0 0 170px; height: 204px; border-radius: 14px; position: relative; overflow: hidden; background: center / cover; color: var(--cream); }
.med::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 35%, rgba(0,0,0,.84)); }

function plan() {
  if (path === 'office-regular') return (state.office === 'lh' ? lhHours : oldHours).filter(([n]) => state.hours.has(n)).map(([n, t]) => ({ n, t }))
  if (path === 'office-new') return [{ n: state.firstHour, t: { Laudes: '07:00', 'Vésperas': '18:00', Completas: '22:00' }[state.firstHour] }]
  if (path === 'rule') return rule().p.filter((p, i) => p.t && !p.w && !state.off.has(i)).map((p) => ({ n: p.n, t: p.t }))
  if (path === 'grow') return guideEntries.filter((e) => state.mine.has(e[0]) && e[4]).map((e) => ({ n: e[1], t: e[4], w: e[5] })).sort((a, b) => a.t.localeCompare(b.t))
  if (path === 'start') return beginner.p.filter((p) => p.e && p.t && !p.w).map((p) => ({ n: p.n, t: p.t }))
  return []
}
function moments() {
  return [['Manhã', 0, 11], ['Meio-dia', 11, 15], ['Tarde', 15, 20], ['Noite', 20, 24]].map(([label, a, b]) => {
    const items = plan().filter((p) => { const h = Number(p.t.slice(0, 2)); return h >= a && h < b })
    return items.length ? { label, time: items[0].t, items } : undefined
  }).filter(Boolean)
}

  document.getElementById('screen').innerHTML = `${s.raw || `<div class="view ${s.dark ? 'dark' : ''} ${s.cls || ''}">${s.body}</div>`}${s.foot ? `<div class="foot ${s.footDark ? 'dark' : ''} ${s.footCls || ''}">${s.foot}</div>` : ''}${s.after || ''}`
  document.getElementById('overlay').innerHTML = ''
  document.getElementById('chips').innerHTML = Object.entries(paths).map(([k, p]) => `<button class="chip ${k === path && step > 0 ? 'on' : ''}" data-jump="${k}">${p.label}</button>`).join('')
  document.getElementById('pathName').textContent = step ? `${paths[path].label} · ${label}` : label
  document.getElementById('why').textContent = why[whyKey]
  document.getElementById('steps').innerHTML = paths[path].steps.map((k, i) => { const fi = { f1: 0, f2: 1, f3: 2 }[k]; const n = fi === undefined ? names[k] : featureNames[paths[path].features[fi]]; return `<li><button class="${i === step ? 'on' : ''}" data-step="${i}"><i>${i + 1}</i>${n}</button></li>` }).join('')
}
function setPath(p, at = 0) { path = p; step = at; render() }
function next() { step = Math.min(step + 1, paths[path].steps.length - 1); render() }
const toggle = (set, v) => (set.has(v) ? set.delete(v) : set.add(v))
const keep = () => { const v = document.querySelector('.view'); const y = v ? v.scrollTop : 0; render(); const n = document.querySelector('.view'); if (n) { n.style.animation = 'none'; n.scrollTop = y } }

document.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return
  if (b.dataset.look) { look = b.dataset.look; return keep() }
  if (b.dataset.jump) { state = fresh(); return setPath(b.dataset.jump, 1) }
  if (b.dataset.step !== undefined) { step = Number(b.dataset.step); return render() }
  if ('back' in b.dataset) { step = Math.max(step - 1, 0); return render() }
  if ('next' in b.dataset) return next()
  const { act, val } = b.dataset
  if (act === 'path') { state = fresh(); return setPath(val === 'office' ? 'office-regular' : val, 1) }
  if (act === 'officePath') { path = val; return next() }
  if (act === 'office') { state.office = val; state.hours = new Set(['Laudes', 'Vésperas', 'Completas']); return keep() }
  if (act === 'hour') { toggle(state.hours, val); return keep() }
  if (act === 'firstHour') { state.firstHour = val; return keep() }
  if (act === 'rule') { state.rule = val; state.off = new Set(); return next() }
  if (act === 'ruleItem') { toggle(state.off, Number(val)); return keep() }
  if (act === 'mine') { toggle(state.mine, val); return keep() }
  if (act === 'takeStep') { state.step = val === '1'; return next() }
  if (act === 'mute') { toggle(state.muted, val); return keep() }
  if (act === 'no-notify') { state.allowed = false; return next() }
  if (act === 'skipFeatures') { step = paths[path].steps.indexOf('pray'); return render() }
  if (act === 'ask-notify') { document.getElementById('overlay').innerHTML = `<div class="scrim"><div class="alert"><div><h4>“Ember” Deseja Enviar Notificações</h4><p>Lembretes do seu plano de vida, na hora de cada oração.</p></div><div class="bt"><button data-act="deny">Não Permitir</button><button data-act="allow">Permitir</button></div></div></div>`; return }
  if (act === 'allow') { state.allowed = true; return next() }
  if (act === 'deny') { state.allowed = false; return next() }
  if (act === 'card') { state.card = val; return next() }
})
setPath('start', 0)
</script>
