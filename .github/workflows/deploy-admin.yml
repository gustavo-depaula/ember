name: Deploy admin

on:
  push:
    branches: [main]
    paths:
      - 'apps/admin/**'
      - 'apps/backend/src/lib/**'
      - 'apps/backend/migrations/**'
      - 'packages/api/**'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:

# Shares the backend's group: both apply the same D1 migrations, and never at once.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter '@ember/admin' run typecheck

      # The panel reads tables the backend's migrations create; applying is a no-op when it already ran.
      - name: Apply D1 migrations (remote)
        run: pnpm --filter '@ember/backend' exec wrangler d1 migrations apply ember-mass-times --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Builds the page, then the reviewer image with the runner's Docker, and ships both.
      - name: Deploy Worker and container
        run: pnpm --filter '@ember/admin' run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
