name: Deploy Hearth to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'apps/hearth/**'
      - 'apps/site/**'
      - '.github/workflows/deploy.yml'
      - 'scripts/build-creator-meta.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # content/do (Divinum Officium) is a submodule; build_do() needs it
          submodules: true

      - name: Install image tools
        run: |
          sudo apt-get update && sudo apt-get install -y webp
          pip install pillow

      # Converting the holy cards takes minutes and a card rarely changes, so
      # the converted images are carried from one run to the next. The key is
      # git's own blob hashes: reading them costs nothing, where hashing the
      # 2 GB of PNGs would.
      - name: Fingerprint source images
        id: images
        run: |
          # One byte order for sort here and comm below, or comm misreads the lists.
          export LC_ALL=C
          git ls-files -s content/art content/saints | grep '\.png$' | sort > "$RUNNER_TEMP/images.manifest"
          echo "hash=$(sha256sum < "$RUNNER_TEMP/images.manifest" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore converted images
        uses: actions/cache@v4
        with:
          path: |
            content/saints/*.webp
            content/saints/thumbs
            content/saints/prints
            .hearth-images.manifest
          key: hearth-images-${{ hashFiles('scripts/convert-webp.sh', 'scripts/print-cards.py') }}-${{ steps.images.outputs.hash }}
          restore-keys: |
            hearth-images-${{ hashFiles('scripts/convert-webp.sh', 'scripts/print-cards.py') }}-

      - name: Convert images
        run: |
          export LC_ALL=C
          new="$RUNNER_TEMP/images.manifest"
          old=.hearth-images.manifest
          # The scripts convert a PNG only when it is newer than its output,
          # and a fresh checkout stamps every file "now". So age them all,
          # then make new again only the ones whose content changed since the
          # restored images were made.
          find content/art content/saints -name '*.png' -exec touch -d '2000-01-01' {} +
          if [ -f "$old" ]; then
            # A removed card would leave its images behind in the restored
            # set: start clean (tracked files are untouched).
            if [ -n "$(comm -23 <(cut -f2 "$old" | sort) <(cut -f2 "$new" | sort))" ]; then
              git clean -fdxq content/saints
            fi
            comm -13 "$old" "$new" | cut -f2 | while IFS= read -r f; do touch "$f"; done
          fi
          scripts/convert-webp.sh
          cp "$new" "$old"

      - name: Stage Hearth files
        run: |
          mkdir -p _site/hearth/v2
          cp apps/hearth/index.html _site/index.html
          cp apps/hearth/privacy.html _site/privacy.html
          cp -r apps/hearth/site _site/site

          # Auxiliary content served alongside the corpus (Bible, sacred art, EF propers, etc.)
          for d in art bible lectionary propers; do
            if [ -d "content/$d" ]; then
              cp -r "content/$d" "_site/hearth/v2/$d"
            fi
          done
          # The app only ever asks for a holy card as WebP; the PNG originals
          # are 2 GB the site would carry for nothing.
          rsync -a --exclude='/*.png' content/saints/ _site/hearth/v2/saints/

      - name: Install corpus builder deps
        run: pip install snowballstemmer

      - name: Build content corpus (Hearth v2)
        run: python3 scripts/build-corpus.py _site/hearth/v2

      - name: Build creator metadata (channel images + shorts classification)
        run: python3 scripts/build-creator-meta.py _site/hearth/v2

      # The website (apps/site) is built from the corpus just assembled and
      # published at the root, beside it. Off until the PUBLISH_SITE repository
      # variable is 'true': it replaces what the domain's front page shows.
      - uses: pnpm/action-setup@v4
        if: vars.PUBLISH_SITE == 'true'

      - uses: actions/setup-node@v4
        if: vars.PUBLISH_SITE == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Build the website
        if: vars.PUBLISH_SITE == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @ember/site run build
          pnpm --filter @ember/site run check:links
          # The developer index of the corpus moves under /hearth/; the policy
          # the store listings link to keeps its address.
          mv _site/index.html _site/hearth/index.html
          cp -r apps/site/dist/. _site/
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          EMBER_SITE_OF_TEXTS: ${{ vars.SITE_OF_TEXTS }}
          EMBER_SITE_CHURCHES: ${{ vars.SITE_CHURCHES }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
