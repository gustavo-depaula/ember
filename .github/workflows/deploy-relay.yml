name: Deploy relay

on:
  push:
    branches: [main, sync-engine]
    paths:
      - 'apps/relay/**'
      - '.github/workflows/deploy-relay.yml'
  workflow_dispatch:

concurrency:
  group: deploy-relay
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm --filter '@ember/relay' run test

      # The Worker makes its own tables, so there is no migration step; the first deploy also
      # creates the database its config names.
      - name: Deploy Worker
        run: pnpm --filter '@ember/relay' exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
