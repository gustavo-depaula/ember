<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: Junicode; font-style: italic; src: url(../site/fonts/Junicode-Italic.woff2); }
@font-face { font-family: 'EB Garamond'; src: url(../site/fonts/EBGaramond_400Regular.woff2); }
@font-face { font-family: Cinzel; src: url(../site/fonts/Cinzel_400Regular.woff2); }
:root { --ink:#0E0D0C; --raised:#1A1714; --parchment:#F4E8CF; --vellum:#CFC3A8; --gold:#C9A84C; --oxblood:#8E2231; }
body { margin:0; background:#444; }
.card { width:1200px; height:630px; position:relative; overflow:hidden; background:var(--ink); color:var(--vellum); font-family:'EB Garamond',serif; margin-bottom:40px; }
.mark { display:flex; align-items:center; gap:18px; font:34px Cinzel,serif; letter-spacing:.16em; color:var(--parchment); }
.mark img { width:64px; height:64px; border-radius:15px; }
h1 { margin:0; font:italic 400 76px/1.06 Junicode,serif; color:var(--parchment); }
.small { font:19px Cinzel,serif; letter-spacing:.2em; color:var(--gold); text-transform:uppercase; }
.small i { font-style:normal; color:var(--oxblood); margin:0 14px; }
.phone { position:absolute; width:300px; border-radius:38px; border:1px solid rgba(201,168,76,.4); box-shadow:0 30px 60px rgba(0,0,0,.7); }

/* A — hero */
#a .text { position:absolute; left:80px; top:70px; width:600px; display:flex; flex-direction:column; gap:44px; }
#a .p1 { left:700px; top:90px; transform:rotate(-5deg); }
#a .p2 { left:880px; top:60px; transform:rotate(4deg); }
#a .small { position:absolute; left:80px; bottom:62px; }

/* B — holy cards */
#b { text-align:center; }
#b .fan { position:absolute; top:46px; left:0; right:0; display:flex; justify-content:center; }
#b .fan img { width:170px; aspect-ratio:2/3; object-fit:cover; border:7px solid var(--parchment); border-radius:5px; margin:0 -18px; box-shadow:0 18px 36px rgba(0,0,0,.65); }
#b .fan img:nth-child(odd){ transform:rotate(-5deg) translateY(10px);} #b .fan img:nth-child(even){ transform:rotate(4deg) translateY(-8px);} #b .fan img:nth-child(3){ transform:translateY(-14px); z-index:1;}
#b .foot { position:absolute; left:0; right:0; bottom:54px; display:flex; flex-direction:column; align-items:center; gap:20px; }
#b h1 { font-size:58px; }

/* C — parchment */
#c { background:var(--parchment); color:#3A3126; }
#c .mark { color:#1F1A14; }
#c h1 { color:#1F1A14; }
#c .small { color:#7A5C17; }
#c .text { position:absolute; left:80px; top:70px; width:640px; display:flex; flex-direction:column; gap:40px; }
#c .small { position:absolute; left:80px; bottom:62px; }
#c .phone { left:800px; top:56px; transform:rotate(3deg); border-color:rgba(122,92,23,.4); box-shadow:0 30px 50px rgba(60,40,10,.3); }

/* D — painting */
#d .art { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 30%; }
#d::after { content:''; position:absolute; inset:0; background:linear-gradient(90deg, rgba(14,13,12,.95) 0%, rgba(14,13,12,.85) 42%, rgba(14,13,12,.1) 75%); }
#d .text { position:absolute; z-index:1; left:80px; top:70px; width:600px; display:flex; flex-direction:column; gap:44px; }
#d .small { position:absolute; z-index:1; left:80px; bottom:62px; }
</style></head><body>

<div class="card" id="a">
  <div class="text"><div class="mark"><img src="../site/img/icon.webp">EMBER</div><h1>The Catholic life of prayer, day by day.</h1></div>
  <img class="phone p1" src="../site/img/en-US-01-today.webp"><img class="phone p2" src="../site/img/en-US-04-holy-card.webp">
  <div class="small">Rosary<i>✠</i>Mass<i>✠</i>Hours<i>✠</i>Saints</div>
</div>

<div class="card" id="b">
  <div class="fan"><img src="../site/img/cards/francis_assisi.webp"><img src="../site/img/cards/our_lady_rosary.webp"><img src="../site/img/cards/peter.webp"><img src="../site/img/cards/michael_archangel.webp"><img src="../site/img/cards/cecilia.webp"></div>
  <div class="foot"><div class="mark"><img src="../site/img/icon.webp">EMBER</div><h1>The Catholic life of prayer, day by day.</h1></div>
</div>

<div class="card" id="c">
  <div class="text"><div class="mark"><img src="../site/img/icon.webp">EMBER</div><h1>The Catholic life of prayer, day by day.</h1></div>
  <img class="phone" src="../site/img/en-US-03-rosary.webp">
  <div class="small">Free on iPhone and Android</div>
</div>

<div class="card" id="d">
  <img class="art" src="../site/img/art/joyful-1-annunciation.webp">
  <div class="text"><div class="mark"><img src="../site/img/icon.webp">EMBER</div><h1>The Catholic life of prayer, day by day.</h1></div>
  <div class="small">Rosary<i>✠</i>Mass<i>✠</i>Hours<i>✠</i>Saints</div>
</div>
<script>const h=location.hash.slice(1);if(h){document.body.style.margin=0;document.querySelectorAll(".card").forEach(c=>{if(c.id!==h)c.remove();else c.style.margin=0})}</script></body></html>
