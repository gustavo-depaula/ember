<!doctype html>
<meta charset="utf-8">
<style>
  @font-face { font-family: Junicode; src: url(../../../../hearth/site/fonts/Junicode.woff2) format('woff2'); }
  @font-face { font-family: Junicode; font-style: italic; src: url(../../../../hearth/site/fonts/Junicode-Italic.woff2) format('woff2'); }
  html, body { margin: 0; width: 1320px; height: 2868px; overflow: hidden; background: #0E0D0C; }
  body {
    background:
      radial-gradient(1500px 1100px at 50% 34%, rgba(201,168,76,.20), transparent 70%),
      radial-gradient(1800px 1400px at 50% 108%, rgba(142,34,49,.22), transparent 70%),
      #0E0D0C;
  }
  h1 {
    position: absolute; top: 150px; left: 110px; right: 110px; margin: 0;
    font: 400 124px/1.1 Junicode, serif; letter-spacing: -.5px; text-align: center;
    color: #F4E8CF; text-wrap: balance;
  }
  .phone {
    position: absolute; left: 50%; top: 560px; width: 1100px; transform: translateX(-50%);
    border-radius: 132px; padding: 14px; background: #1A1714;
    box-shadow: 0 0 0 2px rgba(201,168,76,.55), 0 60px 160px rgba(0,0,0,.7);
  }
  .phone img { display: block; width: 100%; border-radius: 120px; }
  /* 13" iPad: 2064 x 2752. */
  html.ipad, html.ipad body { width: 2064px; height: 2752px; }
  html.ipad h1 { top: 130px; left: 200px; right: 200px; font-size: 128px; }
  html.ipad .phone { top: 470px; width: 1720px; border-radius: 72px; padding: 18px; }
  html.ipad .phone img { border-radius: 56px; }
</style>
<h1 id="c"></h1>
<div class="phone"><img id="s"></div>
<script>
  const p = new URLSearchParams(location.search)
  if (p.get('d') === 'ipad') document.documentElement.className = 'ipad'
  document.getElementById('c').textContent = p.get('c')
  document.getElementById('s').src = p.get('s')
</script>
