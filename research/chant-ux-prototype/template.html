<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canto no texto — cinco direções</title>
<style>
/*FONTS*/
:root {
  --ink: #2C2418; --ink2: #6B5D4F; --gold: #C9A84C; --goldDeep: #A8872E; --line: #E5DDD2;
  --burgundy: #6B1D2A; --paper: #FFFFFF; --surface: #F5F5F5;
  --head: 'Cinzel', 'Trajan Pro', serif; --body: 'EB Garamond', Georgia, serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: #DED7CA; color: var(--ink); font-family: var(--body); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
header.top { padding: 22px 28px 6px; display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap; }
header.top h1 { font-family: var(--head); font-weight: 600; font-size: 20px; margin: 0; letter-spacing: 1px; }
.switch button { font-size: 16px; padding: 6px 14px; border-radius: 20px; border: 1px solid #b9ad98; margin-right: 6px; }
.switch button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.row { display: flex; gap: 34px; padding: 14px 28px 40px; overflow-x: auto; align-items: flex-start; }
.col { flex: 0 0 390px; }
.col h2 { font-family: var(--head); font-size: 15px; letter-spacing: 1.5px; margin: 0 0 4px; }
.col p.what { margin: 0 0 12px; font-size: 16px; line-height: 21px; color: var(--ink2); min-height: 128px; }
.col p.what b { color: var(--ink); font-weight: 400; }
.phone { width: 390px; height: 800px; border-radius: 44px; overflow: hidden; position: relative; background: var(--paper); box-shadow: 0 0 0 9px #111, 0 24px 50px rgba(0,0,0,.35); }
.phone ::-webkit-scrollbar { display: none; }

/* the reading page */
.bar { position: absolute; top: 0; left: 0; right: 0; height: 96px; padding: 50px 14px 0; display: flex; align-items: center; background: rgba(255,255,255,.96); border-bottom: 1px solid var(--line); z-index: 3; }
.bar .back { width: 36px; font-size: 30px; line-height: 30px; color: var(--ink2); text-align: left; padding-left: 6px; }
.bar .title { flex: 1; text-align: center; font-family: var(--head); font-size: 14px; letter-spacing: 1.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .acts { min-width: 36px; display: flex; justify-content: flex-end; }
.page { position: absolute; inset: 96px 0 0 0; overflow-y: auto; padding: 22px 24px 120px; }
.kicker { text-align: center; font-family: var(--head); font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--ink2); }
.h { text-align: center; font-family: var(--head); font-size: 25px; line-height: 31px; font-weight: 400; margin: 6px 0 4px; }
.orn { text-align: center; color: var(--gold); font-size: 15px; margin-bottom: 20px; }
.block { margin-bottom: 28px; }
.lrow { display: flex; align-items: center; min-height: 30px; gap: 10px; margin-bottom: 4px; }
.label { font-family: var(--head); font-size: 11.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--burgundy); flex: 1; }
.cite { font-style: italic; font-size: 15px; color: var(--burgundy); margin-bottom: 3px; }
.text p { font-size: 19.5px; line-height: 28px; margin: 0 0 8px; }
.gloss p { font-size: 16.5px; line-height: 23px; margin: 0 0 6px; color: var(--ink2); font-style: italic; }
.gloss { margin-top: 10px; }
.mode { font-size: 14.5px; color: var(--ink2); font-style: italic; white-space: nowrap; }
.ref { font-size: 13.5px; color: var(--ink2); margin-top: 8px; }
.score { display: block; color: var(--ink); max-width: 100%; height: auto; }
.score text { font-family: var(--body); }
.score .rubric { fill: var(--burgundy); }
.neume { width: 22px; height: 18px; display: block; }
.mark { color: var(--goldDeep); padding: 6px 0 6px 8px; }
.mark .neume { width: 19px; height: 15px; }

/* A — one control for the page */
.sing { width: 40px; height: 34px; border-radius: 17px; display: flex; align-items: center; justify-content: center; color: var(--ink2); border: 1px solid var(--line); transition: background .2s, color .2s; }
.sing.on { background: var(--ink); color: #F5EEE1; border-color: var(--ink); }

/* B — two faces of a block */
.faces { display: flex; gap: 14px; position: relative; font-family: var(--head); font-size: 10.5px; letter-spacing: 1.5px; text-transform: uppercase; }
.faces button { padding: 7px 0 8px; color: var(--ink2); }
.faces button.on { color: var(--ink); }
.faces i { position: absolute; bottom: 2px; height: 1.5px; background: var(--gold); transition: left .25s, width .25s; }
.flip { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; align-items: flex-start; transition: height .25s; gap: 24px; margin: 0 -24px; padding: 0 24px; scroll-padding: 0 24px; }
.flip > div { flex: 0 0 342px; scroll-snap-align: start; scroll-snap-stop: always; }

/* D — the chant book, a page of its own */
.cantar { font-family: var(--head); font-size: 10.5px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--goldDeep); display: flex; align-items: center; gap: 6px; border-bottom: 1px solid var(--gold); padding-bottom: 3px; }
.cantar .neume { width: 17px; height: 14px; }
.book { position: absolute; inset: 0; background: var(--paper); z-index: 6; transform: translateX(100%); transition: transform .32s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; }
.book.open { transform: none; }
.book .bar { position: static; flex: 0 0 96px; border-bottom: 0; }
.tabs { display: flex; gap: 22px; padding: 0 24px; border-bottom: 1px solid var(--line); position: relative; flex: 0 0 auto; }
.tabs button { font-family: var(--head); font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; padding: 9px 0 11px; color: var(--ink2); }
.tabs button.on { color: var(--burgundy); }
.tabs i { position: absolute; bottom: -1px; height: 2px; background: var(--burgundy); transition: left .25s, width .25s; }
.pager { flex: 1; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; }
.pager > div { flex: 0 0 390px; scroll-snap-align: start; scroll-snap-stop: always; overflow-y: auto; padding: 22px 24px 60px; }
.pager .h { font-size: 22px; }

/* E — the lectern: a staff docked under the text */
.dock { position: absolute; left: 0; right: 0; bottom: 0; height: 470px; background: var(--paper); border-top: 1px solid var(--line); box-shadow: 0 -8px 24px rgba(44,36,24,.10); border-radius: 18px 18px 0 0; z-index: 4; transform: translateY(402px); transition: transform .32s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; }
.dock.up { transform: none; }
.dock .grip { flex: 0 0 68px; padding: 8px 24px 0; text-align: left; width: 100%; }
.dock .handle { width: 38px; height: 4px; border-radius: 2px; background: rgba(150,140,120,.55); margin: 0 auto 9px; }
.dock .now { display: flex; align-items: center; gap: 10px; }
.dock .now .neume { color: var(--goldDeep); }
.dock .now b { font-family: var(--head); font-weight: 400; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--burgundy); }
.dock .now span { flex: 1; font-style: italic; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dock .body { flex: 1; overflow-y: auto; padding: 6px 24px 30px; }
.block.cur .label { color: var(--goldDeep); }
</style>
</head>
<body>
<header class="top">
  <h1>Canto no texto — cinco direções</h1>
  <div class="switch" id="scene"></div>
</header>
<div class="row" id="row"></div>
<script>
const data = /*DATA*/;
const flags = location.hash;
let scene = flags.includes('prayer') ? 'prayer' : 'mass';
const demo = flags.includes('on');

const neume = `<svg class="neume" viewBox="0 0 22 18" aria-hidden="true"><g stroke="currentColor" stroke-width=".9" opacity=".55"><path d="M0 2.5h22M0 6.8h22M0 11.1h22M0 15.4h22"/></g><g fill="currentColor"><rect x="3" y="9" width="4.2" height="4.2"/><rect x="8.6" y="4.7" width="4.2" height="4.2"/><rect x="14.4" y=".4" width="4.2" height="4.2"/><rect x="8.5" y="4.7" width=".9" height="8.5"/></g></svg>`;
const paras = (lines) => lines.map((l) => `<p>${l}</p>`).join('');
const text = (b) => `${b.ptCite ? `<div class="cite">${b.ptCite}</div>` : ''}<div class="text">${paras(b.pt)}</div>`;
const score = (b) => `${b.svg}<div class="gloss">${paras(b.pt)}</div><div class="ref">${b.book} · GregoBase, CC0</div>`;
const mode = (b) => `<span class="mode">Modo ${b.mode}</span>`;
const label = (b, extra = '') => (b.label || extra ? `<div class="lrow"><span class="label">${b.label}</span>${extra}</div>` : '');
const opening = (s) => `<div class="kicker">${s.kicker}</div><h3 class="h">${s.title}</h3><div class="orn">✠</div>`;
const bar = (s, acts = '', back = '') => `<div class="bar"><button class="back" ${back} aria-label="Voltar">‹</button><div class="title">${s.title}</div><div class="acts">${acts}</div></div>`;
const underline = (strip) => {
  const on = strip.querySelector('.on'), line = strip.querySelector('i');
  line.style.left = on.offsetLeft + 'px';
  line.style.width = on.offsetWidth + 'px';
};

const directions = [
  {
    name: 'A · Modo cantado',
    what: 'Um só botão, no cabeçalho, liga o canto para a página inteira: todo texto que tem melodia passa a ser a sua partitura, com a tradução por baixo. A escolha fica lembrada. <b>Um gesto serve a Missa toda</b>; quem só lê nunca vê uma nota.',
    build(phone, s) {
      let on = demo;
      const draw = () => {
        const top = phone.querySelector('.page')?.scrollTop ?? 0;
        phone.innerHTML = bar(s, `<button class="sing ${on ? 'on' : ''}" aria-label="Modo cantado" aria-pressed="${on}">${neume}</button>`) +
          `<div class="page">${opening(s)}${s.blocks.map((b) => `<div class="block">${
            b.sung && on ? label(b, mode(b)) + score(b) : label(b) + text(b)
          }</div>`).join('')}</div>`;
        phone.querySelector('.page').scrollTop = top;
        phone.querySelector('.sing').onclick = () => { on = !on; draw(); };
      };
      draw();
    },
  },
  {
    name: 'B · Duas faces',
    what: 'Cada texto cantado tem duas faces, <i>Texto</i> e <i>Canto</i>, ditas na sua própria linha de título. Desliza-se o bloco para o lado (ou toca-se na palavra) e ele vira partitura ali mesmo. <b>Escolhe-se peça a peça</b>, sem sair do lugar.',
    build(phone, s) {
      phone.innerHTML = bar(s) + `<div class="page">${opening(s)}${s.blocks.map((b) => b.sung
        ? `<div class="block">${`<div class="lrow"><span class="label">${b.label}</span><div class="faces"><button class="on">Texto</button><button>Canto</button><i></i></div></div>`}<div class="flip"><div>${text(b)}</div><div>${score(b)}</div></div></div>`
        : `<div class="block">${label(b)}${text(b)}</div>`).join('')}</div>`;
      phone.querySelectorAll('.block').forEach((block, n) => {
        const flip = block.querySelector('.flip');
        if (!flip) return;
        const strip = block.querySelector('.faces'), tabs = [...strip.querySelectorAll('button')];
        const show = (i) => {
          tabs.forEach((t, k) => t.classList.toggle('on', k === i));
          underline(strip);
          flip.style.height = flip.children[i].offsetHeight + 'px';
        };
        flip.onscroll = () => show(Math.round(flip.scrollLeft / 366));
        tabs.forEach((t, i) => (t.onclick = () => flip.scrollTo({ left: i * 366, behavior: 'smooth' })));
        show(0);
        if (demo && n === 0) flip.scrollTo({ left: 366 });
      });
    },
  },
  {
    name: 'C · Sempre à vista',
    what: 'Sem controle nenhum: onde há canto, a partitura está lá, sob o título, e a tradução logo abaixo — como num livro de canto com glosa. <b>Impossível não achar</b>; em troca, a Missa e as Horas ficam bem mais longas para quem só reza lendo.',
    build(phone, s) {
      phone.innerHTML = bar(s) + `<div class="page">${opening(s)}${s.blocks.map((b) => `<div class="block">${
        b.sung ? label(b, mode(b)) + score(b) : label(b) + text(b)
      }</div>`).join('')}</div>`;
    },
  },
  {
    name: 'D · Livro de canto',
    what: 'O texto fica intocado. <i>Cantar</i>, no cabeçalho, abre uma página à parte, composta como um Gradual: só as partituras, uma por página, que se folheiam de lado — o mesmo paginador do Kyriale. A marca junto de um título abre o livro já naquela peça.',
    build(phone, s) {
      const sung = s.blocks.filter((b) => b.sung);
      phone.innerHTML = bar(s, `<button class="cantar">${neume}Cantar</button>`) +
        `<div class="page">${opening(s)}${s.blocks.map((b) => `<div class="block">${
          label(b, b.sung && b.label ? `<button class="mark" data-i="${sung.indexOf(b)}" aria-label="Cantar ${b.label}">${neume}</button>` : '')
        }${text(b)}</div>`).join('')}</div>` +
        `<div class="book">${bar({ title: 'Canto' }, '', 'data-close')}${
          sung.length > 1 ? `<div class="tabs">${sung.map((b, i) => `<button class="${i ? '' : 'on'}">${b.label}</button>`).join('')}<i></i></div>` : ''
        }<div class="pager">${sung.map((b) => `<div><div class="kicker">${b.label || s.kicker} · Modo ${b.mode}</div><h3 class="h">${b.name}</h3><div class="orn">✠</div>${score(b)}</div>`).join('')}</div></div>`;
      const book = phone.querySelector('.book'), pager = book.querySelector('.pager'), strip = book.querySelector('.tabs');
      const tabs = strip ? [...strip.querySelectorAll('button')] : [];
      const show = (i) => { tabs.forEach((t, k) => t.classList.toggle('on', k === i)); if (strip) underline(strip); };
      const open = (i) => { book.classList.add('open'); pager.scrollTo({ left: i * 390 }); show(i); };
      pager.onscroll = () => show(Math.round(pager.scrollLeft / 390));
      tabs.forEach((t, i) => (t.onclick = () => pager.scrollTo({ left: i * 390, behavior: 'smooth' })));
      phone.querySelector('.cantar').onclick = () => open(0);
      phone.querySelectorAll('.mark').forEach((m) => (m.onclick = () => open(+m.dataset.i)));
      book.querySelector('[data-close]').onclick = () => book.classList.remove('open');
      if (flags.includes('book')) open(0);
    },
  },
  {
    name: 'E · Estante',
    what: 'Uma pauta fica encostada ao pé da página, como a estante do cantor, e acompanha a leitura: mostra sempre o canto do trecho que está na tela. Puxa-se para cima e a partitura sobe sob o texto, que continua rolando por cima.',
    build(phone, s) {
      const sung = s.blocks.filter((b) => b.sung);
      phone.innerHTML = bar(s) + `<div class="page">${opening(s)}${s.blocks.map((b) => `<div class="block" ${b.sung ? `data-i="${sung.indexOf(b)}"` : ''}>${label(b)}${text(b)}</div>`).join('')}</div>` +
        `<div class="dock"><button class="grip" aria-label="Partitura"><div class="handle"></div><div class="now">${neume}<b></b><span></span><em class="mode"></em></div></button><div class="body"></div></div>`;
      const page = phone.querySelector('.page'), dock = phone.querySelector('.dock');
      let current = -1;
      const follow = () => {
        // The piece being read: the last sung text whose title has passed the upper part of the page.
        let i = 0;
        page.querySelectorAll('[data-i]').forEach((el) => { if (el.offsetTop - page.scrollTop < 260) i = +el.dataset.i; });
        if (i === current) return;
        current = i;
        const b = sung[i];
        dock.querySelector('b').textContent = b.label;
        dock.querySelector('span').textContent = b.name;
        dock.querySelector('em').textContent = 'Modo ' + b.mode;
        dock.querySelector('.body').innerHTML = b.svg + `<div class="ref">${b.book} · GregoBase, CC0</div>`;
        dock.querySelector('.body').scrollTop = 0;
        page.querySelectorAll('.block').forEach((el) => el.classList.toggle('cur', el.dataset.i === String(i)));
      };
      const raise = (up) => { dock.classList.toggle('up', up); page.style.paddingBottom = up ? '500px' : '120px'; };
      page.onscroll = follow;
      dock.querySelector('.grip').onclick = () => raise(!dock.classList.contains('up'));
      follow();
      if (demo) raise(true);
    },
  },
];

function render() {
  document.getElementById('scene').innerHTML = [['mass', 'Missa'], ['prayer', 'Oração']]
    .map(([k, n]) => `<button class="${k === scene ? 'on' : ''}" data-k="${k}">${n}</button>`).join('');
  document.querySelectorAll('#scene button').forEach((b) => (b.onclick = () => { scene = b.dataset.k; render(); }));
  const row = document.getElementById('row');
  row.innerHTML = '';
  for (const d of directions) {
    const col = document.createElement('div');
    col.className = 'col';
    col.innerHTML = `<h2>${d.name}</h2><p class="what">${d.what}</p><div class="phone"></div>`;
    row.appendChild(col);
    d.build(col.querySelector('.phone'), data[scene]);
  }
}
document.fonts.ready.then(render);
</script>
</body>
</html>
